# Wheel tagging. Declarative, so it applies to EVERY build path — `pip wheel`,
# `pip install .`, `python -m build` — rather than depending on whoever runs the
# build remembering a flag.
#
# The extension is already limited-API: cffi's generated source defines
# Py_LIMITED_API itself, and set_source(py_limited_api=True) makes setuptools
# name the file _accudisc.abi3.so. That is NOT enough on its own, and the gap is
# invisible until it bites: without the line below, a wheel built on 3.14 is
# tagged `cp314-cp314` and pip REFUSES to install it on 3.10, even though the
# .so inside it would have worked. Measured — the first wheel built here came
# out `accudisc-0.4.0-cp314-cp314-linux_x86_64.whl`.
#
# cp310 is this package's floor (requires-python >= 3.10) and cdda2img's
# interpreter. It is the floor that belongs here, not the building
# interpreter's version: an abi3 wheel declares the OLDEST CPython it supports,
# and every newer one is covered.
[bdist_wheel]
py_limited_api = cp310
