[build-system]
# setuptools>=77 for PEP 639 `license = "MIT"` as a plain string; on older
# setuptools that form is not understood and the metadata is wrong rather than
# rejected, which is the failure mode worth avoiding.
requires = ["setuptools>=77", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "accudisc"
# Kept in step with ACCUDISC_VERSION_* in include/accudisc/accudisc.h. Not
# derived automatically, because the honest way to enforce that is a test that
# FAILS on drift rather than a mechanism that hides it:
# tests/test_binding.py::test_package_version_matches_the_library.
version = "0.11.0"
description = "Python binding for libaccudisc — precision Red Book CD-DA reading"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cffi>=1.15"]

[tool.setuptools]
packages = ["accudisc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
